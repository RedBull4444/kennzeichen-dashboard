<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kennzeichen-Scanner</title>
<meta name="theme-color" content="#F3F4F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kennzeichen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F3F4F1; --panel:#FFFFFF; --line:#E1E3DE; --line-strong:#C9CCC5;
  --ink:#15181B; --ink-2:#4A4F55; --muted:#5B6168;
  --accent:#0A6A48; --accent-ink:#0A5A3D; --accent-soft:#DDEFE6;
  --neutral-soft:#E9EAE6; --neutral-ink:#3D4247;
  --warn-soft:#FBEBC8; --warn-ink:#6B4200;
  --err-soft:#F7E1DE; --err-ink:#8A2A1E;
  --eu:#003399;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--ink)} a:hover{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.shell{display:flex;min-height:100vh}
.side{flex:0 0 248px;background:var(--panel);border-right:1px solid var(--line);padding:28px 20px;display:flex;flex-direction:column;gap:32px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand-mark{width:30px;height:20px;border:2px solid var(--ink);border-left:8px solid var(--eu);border-radius:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{padding:11px 12px;border-radius:6px;text-decoration:none;color:var(--ink-2)}
.nav a[aria-current="page"]{background:var(--ground);color:var(--ink);font-weight:600}
.side-status{margin-top:auto;padding:14px;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.side-status strong{color:var(--ink);font-weight:500;font-size:14px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.dot.off{background:var(--line-strong)} .dot.err{background:var(--err-ink)} .dot.busy{background:var(--warn-ink)}

.main{flex:1;min-width:0;padding:36px 40px 56px;display:flex;flex-direction:column;gap:24px;max-width:1240px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.02em}
h2{margin:0;font-size:16px;font-weight:600}
.sub{color:var(--muted);margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.wide{flex:3 1 480px} .narrow{flex:1 1 260px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.btn{height:44px;padding:0 18px;border:1px solid var(--line-strong);border-radius:6px;background:var(--panel);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-2);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:0 24px}
.btn.primary:hover{background:var(--accent-ink);color:#fff}
.btn.quiet{border-color:transparent;background:none;color:var(--accent-ink);font-weight:600;padding:0 10px}
.btn.quiet:hover{background:var(--ground)}
.btn.danger{color:var(--err-ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.form{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2);flex:1 1 110px;min-width:0}
.field.grow{flex:3 1 260px}
.input{height:44px;width:100%;padding:0 12px;border:1px solid var(--line-strong);border-radius:6px;background:#fff}
.input.plate-in{font:600 16px var(--mono);letter-spacing:.04em;text-transform:uppercase}
select.input{padding:0 8px}
.hint{color:var(--muted);font-size:13px;margin:0}
.msg-err{color:var(--err-ink);font-size:13px;margin:0}

.plate{display:inline-flex;align-items:stretch;height:34px;border:2px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden;flex:none;color:var(--ink)}
.plate::before{content:"";width:12px;background:var(--eu)}
.plate span{padding:0 10px;display:flex;align-items:center;font:600 16px var(--mono);letter-spacing:.04em;white-space:nowrap}
.plate.lg{height:44px;border-width:2.5px}.plate.lg::before{width:16px}.plate.lg span{font-size:21px;padding:0 14px}
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.plates .plate span{flex:1;justify-content:center;padding:0 6px;font-size:15px}

.badge{padding:4px 10px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap;display:inline-block}
.b-free{background:var(--accent-soft);color:var(--accent-ink)}
.b-none{background:var(--neutral-soft);color:var(--neutral-ink)}
.b-wait{background:var(--warn-soft);color:var(--warn-ink)}
.b-err{background:var(--err-soft);color:var(--err-ink)}

.result{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 16px;background:var(--ground);border-radius:8px}
.result-block{display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--ground);border-radius:8px}
.result .end{margin-left:auto}
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden;flex-basis:100%}
.progress i{display:block;height:100%;width:40%;background:var(--accent);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.progress i{animation:none;width:100%;opacity:.4}}

.kv{display:flex;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0;padding-bottom:0}
.kv span:first-child{color:var(--muted)} .kv span:last-child{font-weight:500;text-align:right}

.table-box{overflow-x:auto}
table{width:100%;min-width:520px;border-collapse:collapse;text-align:left}
th{padding:10px 8px;font-weight:500;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{padding-left:0} th:last-child,td:last-child{padding-right:0}
td.plate-cell{font:600 15px var(--mono);color:var(--ink);letter-spacing:.03em;white-space:nowrap}
td.act{text-align:right;width:1%}

.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.list-item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.list-item .t{font:600 15px var(--mono);letter-spacing:.03em}
.list-item .s{color:var(--muted);font-size:13px}
.only-mobile{display:none}

.event{display:grid;grid-template-columns:120px 1fr;gap:4px 16px;padding:12px 0;border-top:1px solid var(--line)}
.event:first-child{border-top:0}
.event time{color:var(--muted);font-size:13px;padding-top:1px}
.event .what{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.event .mono{font:600 14px var(--mono)}

.empty{padding:28px 8px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty strong{color:var(--ink);font-weight:600;font-size:15px}

.group{display:flex;flex-direction:column;gap:12px;padding-top:16px;border-top:1px solid var(--line)}
.group:first-child{border-top:0;padding-top:0}
.group-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.group-head b{font:600 15px var(--mono)}

.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.steps b{color:var(--ink);font-weight:600}
code{font:500 13px var(--mono);background:var(--ground);padding:1px 5px;border-radius:4px}

.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--ink-2);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 10px 10px 18px;border-radius:8px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(21,24,27,.18);z-index:20;max-width:calc(100vw - 32px)}
.toast button{height:36px;padding:0 12px;border:0;border-radius:5px;background:rgba(255,255,255,.14);color:#fff;font-weight:600;cursor:pointer}

.topbar,.tabbar{display:none}
@media (max-width:760px){
  .side{display:none}
  .main{padding:8px 16px calc(96px + env(safe-area-inset-bottom));gap:16px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 4px}
  .topbar .brand{font-size:14px}
  .tabbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:4px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
  .tabbar a{height:50px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:13px;color:var(--ink-2);border-top:2px solid transparent}
  .tabbar a[aria-current="page"]{color:var(--ink);font-weight:600;border-top-color:var(--ink)}
  h1{font-size:22px}
  .panel{padding:16px;gap:12px}
  .head .btn{width:100%}
  .event{grid-template-columns:1fr}
  .form .btn.primary{flex:1 1 100%}
  .result .end{margin-left:0;flex-basis:100%}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .only-mobile{display:flex}
  .only-desktop{display:none}
}
.icon-btn.danger{color:var(--err-ink);border-color:transparent;background:none}
.icon-btn.danger:hover{background:var(--err-soft)}
.icon-btn{width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;color:var(--ink)}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Kennzeichen-Scanner</div>
    <nav class="nav" aria-label="Hauptmenü">
      <a href="#uebersicht" data-nav="uebersicht">Übersicht</a>
      <a href="#watchlist" data-nav="watchlist">Watchlist</a>
      <a href="#frei" data-nav="frei">Gerade frei</a>
      <a href="#verlauf" data-nav="verlauf">Verlauf</a>
      <a href="#einstellungen" data-nav="einstellungen">Einstellungen</a>
    </nav>
    <div class="side-status" data-region="sidestatus" aria-live="polite"></div>
  </aside>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Kennzeichen-Scanner</div>
      <a class="icon-btn" href="#einstellungen" aria-label="Einstellungen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </a>
    </header>
    <main class="main" id="main"></main>
  </div>
</div>
<nav class="tabbar" aria-label="Hauptmenü">
  <a href="#uebersicht" data-nav="uebersicht">Übersicht</a>
  <a href="#watchlist" data-nav="watchlist">Watchlist</a>
  <a href="#frei" data-nav="frei">Frei</a>
  <a href="#verlauf" data-nav="verlauf">Verlauf</a>
</nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
const REPO = "RedBull4444/kennzeichen-scanner";
const BRANCH = "main";
const API = "https://api.github.com";
const CITIES = ["BB","LEO","S","ES","NT","LB","VAI","CW","TÜ"];
const MAX_QUERIES = 40;            // muss zu MAX_QUERIES_PER_RUN in kz/scan.py passen
const SCAN_EVERY_HOURS = 3;        // muss zum cron in .github/workflows/scan.yml passen
const SCAN_MINUTE = 17;
const FILES = {watchlist:{entries:[]}, state:{entries:{}}, history:[], instant:[], telegram_status:{}};

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};

const S = {
  token: store.get("kz-token") || "",
  view: "uebersicht",
  loaded: false, loadError: "",
  data: JSON.parse(JSON.stringify(FILES)),
  sha: {},
  form: {city: store.get("kz-city") || "BB", letters: "", numbers: ""},
  add: {city: store.get("kz-city") || "BB", letters: "", numbers: ""},
  inst: null,     // laufende oder letzte Sofort-Abfrage
  scan: null,     // laufender Scan, vom Dashboard gestartet
  showScans: false,
};

/* ---------- Hilfen ---------- */
function esc(v){ return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function plate(label, cls){ return `<span class="plate ${cls||""}"><span>${esc(label)}</span></span>`; }
function showNum(n){ return String(n).replace("-", "–"); }
function labelOf(e){ return `${e.city} ${e.letters} ${showNum(e.numbers)}`; }
function idOf(e){ return `${e.city}|${e.letters}|${e.numbers}`; }

const pad = n => String(n).padStart(2, "0");
function when(ts){
  if (!ts) return "–";
  const d = new Date(ts); if (isNaN(d)) return "–";
  const now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
  const t = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (d.toDateString() === now.toDateString()) return `heute, ${t}`;
  if (d.toDateString() === y.toDateString()) return `gestern, ${t}`;
  return `${pad(d.getDate())}.${pad(d.getMonth()+1)}., ${t}`;
}
function nextScan(from){
  const d = new Date(from || Date.now());
  const n = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), d.getUTCHours(), SCAN_MINUTE));
  while (n <= d || n.getUTCHours() % SCAN_EVERY_HOURS !== 0) n.setUTCHours(n.getUTCHours() + 1, SCAN_MINUTE, 0, 0);
  return n;
}
function untilText(date){
  const min = Math.max(0, Math.round((date - Date.now()) / 60000));
  if (min < 60) return `${min} min`;
  return `${Math.floor(min/60)} h ${pad(min % 60)} min`;
}
function secondsSince(t){ return Math.round((Date.now() - t) / 1000); }

/* Eingaben prüfen, gleiche Regeln wie kz/patterns.py */
function makeEntry(city, letters, numbers){
  city = String(city||"").trim().toUpperCase();
  letters = String(letters||"").trim().toUpperCase();
  numbers = String(numbers||"").trim().replace(/[–—]/g, "-").replace(/\s+/g, "");
  if (!CITIES.includes(city)) throw new Error("Bezirk auswählen.");
  if (!/^[A-ZÄÖÜ?]{1,2}$/.test(letters)) throw new Error("Buchstaben: 1 oder 2 Zeichen, A–Z oder ?.");
  const r = numbers.match(/^(\d{1,4})-(\d{1,4})$/);
  if (r){
    const lo = +r[1], hi = +r[2];
    if (lo < 1 || lo > hi) throw new Error("Zahlenbereich: von muss kleiner als bis sein, ab 1.");
  } else if (!/^[0-9?]{1,4}$/.test(numbers)) {
    throw new Error("Zahlen: 1 bis 4 Ziffern, ? oder Bereich wie 1-99.");
  } else if (numbers[0] === "0") {
    throw new Error("Zahlen dürfen nicht mit 0 beginnen.");
  }
  return {city, letters, numbers};
}
function isExact(e){ return !/-/.test(e.numbers) && !/\?/.test(e.letters + e.numbers); }
function queryCount(e){
  const r = e.numbers.match(/^(\d+)-(\d+)$/);
  return r ? r[2].length - r[1].length + 1 : 1;
}

/* ---------- GitHub ---------- */
class GhError extends Error { constructor(msg, status){ super(msg); this.status = status; } }
async function gh(path, opts = {}){
  let res;
  try {
    res = await fetch(API + path, {
      ...opts, cache: "no-store",
      headers: {"Accept":"application/vnd.github+json", "Authorization":`Bearer ${S.token}`,
                "X-GitHub-Api-Version":"2022-11-28", ...(opts.body ? {"Content-Type":"application/json"} : {})},
    });
  } catch (e) { throw new GhError("Keine Verbindung zu GitHub. Internet prüfen.", 0); }
  if (res.status === 401) throw new GhError("Der GitHub-Schlüssel ist ungültig oder abgelaufen. Unter Einstellungen neu eintragen.", 401);
  return res;
}
function b64decode(s){ const bin = atob(s.replace(/\n/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function b64encode(s){ const bytes = new TextEncoder().encode(s); let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); }

async function readFile(name){
  const res = await gh(`/repos/${REPO}/contents/data/${name}.json?ref=${BRANCH}`);
  if (res.status === 404) { S.sha[name] = undefined; return JSON.parse(JSON.stringify(FILES[name])); }
  if (!res.ok) throw new GhError(res.status === 403
      ? "Der Schlüssel darf das Repo nicht lesen. Berechtigung „Contents: Lesen und schreiben“ setzen."
      : `GitHub antwortet mit Fehler ${res.status}.`, res.status);
  const j = await res.json();
  S.sha[name] = j.sha;
  try { return JSON.parse(b64decode(j.content)); } catch(e) { return JSON.parse(JSON.stringify(FILES[name])); }
}
async function writeFile(name, value, message){
  const body = {message, branch: BRANCH, content: b64encode(JSON.stringify(value, null, 2) + "\n")};
  if (S.sha[name]) body.sha = S.sha[name];
  const res = await gh(`/repos/${REPO}/contents/data/${name}.json`, {method:"PUT", body: JSON.stringify(body)});
  if (res.status === 409 || res.status === 422) return false;  // inzwischen geändert
  if (!res.ok) throw new GhError(res.status === 403
      ? "Der Schlüssel darf nicht speichern. Berechtigung „Contents: Lesen und schreiben“ setzen."
      : `Speichern fehlgeschlagen (Fehler ${res.status}).`, res.status);
  S.sha[name] = (await res.json()).content.sha;
  return true;
}
async function dispatch(inputs){
  const res = await gh(`/repos/${REPO}/actions/workflows/scan.yml/dispatches`,
    {method:"POST", body: JSON.stringify({ref: BRANCH, inputs})});
  if (res.status === 204) return;
  if (res.status === 403 || res.status === 404)
    throw new GhError("Der Schlüssel darf keine Läufe starten. Berechtigung „Actions: Lesen und schreiben“ setzen.", res.status);
  throw new GhError(`Lauf konnte nicht gestartet werden (Fehler ${res.status}).`, res.status);
}

/* Neuen Schlüssel prüfen, bevor er gespeichert wird */
async function verifyToken(t){
  const prev = S.token; S.token = t;
  try {
    const res = await gh(`/repos/${REPO}`);
    if (res.status === 404 || res.status === 403)
      throw new GhError("Der Schlüssel hat keinen Zugriff auf kennzeichen-scanner. Bei „Repository access“ das Repo auswählen.", res.status);
    if (!res.ok) throw new GhError(`GitHub antwortet mit Fehler ${res.status}.`, res.status);
  } finally { S.token = prev; }
}

async function loadAll(){
  if (!S.token) { S.loaded = false; render(); return; }
  try {
    const names = Object.keys(FILES);
    const values = await Promise.all(names.map(readFile));
    names.forEach((n, i) => S.data[n] = values[i]);
    S.loaded = true; S.loadError = "";
  } catch (e) {
    S.loadError = e.message;
  }
  refresh();
}

/* Watchlist ändern: immer auf den neuesten Stand aufsetzen, bei Konflikt einmal neu versuchen */
async function changeWatchlist(fn, message){
  for (let attempt = 0; attempt < 3; attempt++){
    const wl = await readFile("watchlist");
    const entries = fn(Array.isArray(wl.entries) ? wl.entries : []);
    if (entries === null) return false;
    if (await writeFile("watchlist", {entries}, message)) { S.data.watchlist = {entries}; refresh(); return true; }
  }
  throw new GhError("Die Watchlist wurde gleichzeitig geändert. Bitte noch einmal versuchen.", 409);
}
async function addEntry(e){
  let dup = false;
  await changeWatchlist(list => {
    if (list.some(x => idOf(x) === idOf(e))) { dup = true; return null; }
    return [...list, {city: e.city, letters: e.letters, numbers: e.numbers}];
  }, `Watchlist: ${labelOf(e)} hinzugefügt`);
  toast(dup ? `${labelOf(e)} steht schon auf der Watchlist.` : `${labelOf(e)} ist auf der Watchlist.`);
}
async function removeEntry(id){
  let removed = null;
  await changeWatchlist(list => {
    removed = list.find(x => idOf(x) === id) || null;
    return removed ? list.filter(x => idOf(x) !== id) : null;
  }, `Watchlist: Eintrag entfernt`);
  if (removed) toast(`${labelOf(removed)} entfernt.`, "Rückgängig", () => run(() => addEntry(removed)));
}

/* ---------- Abläufe ---------- */
async function startInstant(entry){
  const id = "w" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  S.inst = {phase: "running", entry, id, started: Date.now(), note: "Abfrage wird gestartet"};
  refresh();
  try {
    await dispatch({mode: "instant", city: entry.city, letters: entry.letters, numbers: entry.numbers, request_id: id});
    S.inst.note = "Läuft auf GitHub";
    while (S.inst && S.inst.id === id && secondsSince(S.inst.started) < 240){
      await sleep(4000);
      const list = await readFile("instant");
      S.data.instant = list;
      const hit = Array.isArray(list) && list.find(r => r.id === id);
      if (hit){ S.inst = {phase: "done", entry, id, result: hit}; refresh(); return; }
      if (secondsSince(S.inst.started) > 45) S.inst.note = "Dauert länger als üblich, wartet evtl. auf einen freien GitHub-Rechner";
    }
    if (S.inst && S.inst.id === id){ S.inst = {phase:"error", entry, id, message:"Keine Antwort nach 4 Minuten. Später noch einmal versuchen."}; }
  } catch (e) {
    S.inst = {phase: "error", entry, id, message: e.message};
  }
  refresh();
}
async function startScan(){
  const before = S.data.state.updated || null;
  S.scan = {started: Date.now(), before};
  refresh();
  try {
    await dispatch({mode: "scan"});
    while (S.scan && secondsSince(S.scan.started) < 20 * 60){
      await sleep(10000);
      const st = await readFile("state");
      if (st.updated && st.updated !== before){
        await loadAll();
        S.scan = null; refresh();
        toast("Scan fertig.");
        return;
      }
    }
    S.scan = null; toast("Scan läuft noch, Ergebnis kommt mit der nächsten Aktualisierung.");
  } catch (e) {
    S.scan = null; toast(e.message);
  }
  refresh();
}
async function run(fn){
  try { await fn(); } catch (e) { toast(e.message || "Das hat nicht geklappt."); }
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(text, actionLabel, action){
  const el = document.getElementById("toast");
  el.innerHTML = `<span>${esc(text)}</span>` + (actionLabel ? `<button type="button">${esc(actionLabel)}</button>` : "");
  el.hidden = false;
  if (actionLabel) el.querySelector("button").onclick = () => { el.hidden = true; action(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.hidden = true, actionLabel ? 7000 : 3500);
}

/* ---------- Daten für die Anzeige ---------- */
function entries(){
  const list = (S.data.watchlist && Array.isArray(S.data.watchlist.entries)) ? S.data.watchlist.entries : [];
  return list.map(e => {
    const st = (S.data.state.entries || {})[idOf(e)] || null;
    return {...e, id: idOf(e), label: labelOf(e), exact: isExact(e), st};
  });
}
function statusOf(e){
  const st = e.st;
  if (!st || !st.checked) return st && st.error
    ? {cls:"b-err", text:"Fehler", note: st.error}
    : {cls:"b-wait", text:"Noch nicht geprüft", note:"wird beim nächsten Scan geprüft"};
  const n = (st.free || []).length;
  const s = e.exact ? (n ? {cls:"b-free", text:"Frei"} : {cls:"b-none", text:"Nicht frei"})
                    : (n ? {cls:"b-free", text:`${n} frei`} : {cls:"b-none", text:"Keine frei"});
  s.note = when(st.checked) + (st.error ? " · letzter Versuch fehlgeschlagen" : "");
  return s;
}
function allFree(){
  const seen = new Set(), out = [];
  entries().forEach(e => ((e.st && e.st.free) || []).forEach(p => { if (!seen.has(p)) { seen.add(p); out.push(p); } }));
  return out;
}
function totalQueries(){ return entries().reduce((n, e) => n + queryCount(e), 0); }

/* ---------- Ereignisse ---------- */
document.addEventListener("input", ev => {
  const f = ev.target.closest("form[data-form]"); if (!f) return;
  const key = f.dataset.form === "instant" ? "form" : f.dataset.form === "add" ? "add" : null;
  if (!key || !ev.target.name) return;
  S[key][ev.target.name] = ev.target.value;
  if (ev.target.name === "city") store.set("kz-city", ev.target.value);
});
document.addEventListener("change", ev => {
  if (ev.target.matches('[data-action="toggle-scans"]')) { S.showScans = ev.target.checked; refresh(); }
});
document.addEventListener("submit", ev => {
  const f = ev.target.closest("form[data-form]"); if (!f) return;
  ev.preventDefault();
  const kind = f.dataset.form, err = document.querySelector(`[data-err="${kind}"]`);
  const showErr = m => { if (err) { err.textContent = m; err.hidden = !m; } };
  showErr("");
  if (kind === "token"){
    const t = f.token.value.trim();
    if (!t) return showErr("Bitte den Schlüssel einfügen.");
    const btn = f.querySelector("button"); btn.disabled = true;
    verifyToken(t).then(() => {
      S.token = t; store.set("kz-token", t);
      S.loadError = ""; S.loaded = false;
      toast("Verbunden.");
      if (location.hash === "#uebersicht") render(); else location.hash = "#uebersicht";
      return loadAll();
    }).catch(e => { showErr(e.message); btn.disabled = false; });
    return;
  }
  let entry;
  try { entry = makeEntry(f.city.value, f.letters.value, f.numbers.value); }
  catch (e) { return showErr(e.message); }
  if (kind === "instant"){ S.form = {...entry, numbers: entry.numbers}; startInstant(entry); }
  if (kind === "add"){
    run(async () => { await addEntry(entry); S.add = {city: entry.city, letters: "", numbers: ""}; f.letters.value = ""; f.numbers.value = ""; f.letters.focus(); });
  }
});
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-action]"); if (!b) return;
  const a = b.dataset.action;
  if (a === "scan-now") run(startScan);
  if (a === "remove") run(() => removeEntry(b.dataset.id));
  if (a === "add-instant" && S.inst) run(() => addEntry(S.inst.entry));
  if (a === "forget-token"){ store.del("kz-token"); S.token = ""; S.loaded = false; S.data = JSON.parse(JSON.stringify(FILES)); render(); toast("Schlüssel gelöscht."); }
});
window.addEventListener("hashchange", render);

/* Laufende Anzeigen jede Sekunde, Daten jede Minute aktualisieren (nur wenn sichtbar) */
setInterval(() => {
  if (S.inst && S.inst.phase === "running") document.querySelectorAll('[data-region="instantresult"]').forEach(el => el.innerHTML = REGIONS.instantresult());
}, 1000);
setInterval(() => { if (!document.hidden && S.token && !S.scan) loadAll(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.token) loadAll(); });

render();
loadAll();
</script>
</body>
</html>
